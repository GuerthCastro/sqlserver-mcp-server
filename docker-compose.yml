services:
  sqlserver-mcp:
    build: .
    ports:
      - "3200:80"
    environment:
      MCP_API_TOKEN: ${MCP_API_TOKEN:?Set MCP_API_TOKEN in a .env file next to this compose file}
      MCP_COMMAND_TIMEOUT_SECONDS: ${MCP_COMMAND_TIMEOUT_SECONDS:-30}
      MCP_PAGE_MAX_ROWS: ${MCP_PAGE_MAX_ROWS:-200}
      MCP_PAGE_MAX_CHARACTERS: ${MCP_PAGE_MAX_CHARACTERS:-20000}
      MCP_CONNECTION_IDLE_MINUTES: ${MCP_CONNECTION_IDLE_MINUTES:-60}
      MCP_WRITE_MODE: ${MCP_WRITE_MODE:-off}
      MCP_WRITE_CONFIRMATION: ${MCP_WRITE_CONFIRMATION:-none}
      MCP_WRITE_MAX_ROWS: ${MCP_WRITE_MAX_ROWS:-50}
      MCP_WRITE_CONFIRM_WEBHOOK_URL: ${MCP_WRITE_CONFIRM_WEBHOOK_URL:-}
      MCP_WRITE_CONFIRM_WEBHOOK_SECRET: ${MCP_WRITE_CONFIRM_WEBHOOK_SECRET:-}
    restart: unless-stopped
